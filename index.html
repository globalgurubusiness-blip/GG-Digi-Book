<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>GG Digi Book - Digital Ledger</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- jsPDF & AutoTable -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>

  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    .glass-card { background: rgba(255, 255, 255, 0.96); backdrop-filter: blur(10px); }
  </style>

  <!-- Firebase SDKs -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { 
      getAuth, signInWithPopup, GoogleAuthProvider, signOut, onAuthStateChanged 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { 
      getFirestore, collection, addDoc, onSnapshot, query, where, doc, updateDoc, deleteDoc 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBnzL_AKXDZFE6feQJf5XnasBqcLey0uOs",
      authDomain: "gg-digi-book.firebaseapp.com",
      projectId: "gg-digi-book",
      storageBucket: "gg-digi-book.firebasestorage.app",
      messagingSenderId: "384507968962",
      appId: "1:384507968962:web:89df71ed5ed5bc8656aa5b",
      measurementId: "G-491D264LFB"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const provider = new GoogleAuthProvider();

    let currentUser = null;
    let customersList = [];
    let currentFilter = 'all';
    let selectedCustomer = null;
    let currentTransactions = [];
    let unsubscribeTx = null;
    let attachedPhotoBase64 = "";

    onAuthStateChanged(auth, (user) => {
      currentUser = user;
      if (user) {
        document.getElementById('login-screen').classList.add('hidden');
        document.getElementById('app-screen').classList.remove('hidden');
        document.getElementById('user-name').innerText = user.displayName || user.email;
        loadCustomers();
      } else {
        document.getElementById('login-screen').classList.remove('hidden');
        document.getElementById('app-screen').classList.add('hidden');
      }
    });

    window.loginGoogle = () => {
      signInWithPopup(auth, provider).catch(err => alert("Login Error: " + err.message));
    };
    window.logout = () => signOut(auth);

    function loadCustomers() {
      const q = query(collection(db, "customers"), where("userId", "==", currentUser.uid));
      onSnapshot(q, (snapshot) => {
        customersList = [];
        let totalReceivable = 0;
        let totalPayable = 0;

        snapshot.forEach((docSnap) => {
          const data = { id: docSnap.id, ...docSnap.data() };
          customersList.push(data);
          if (data.balance > 0) totalReceivable += data.balance;
          if (data.balance < 0) totalPayable += Math.abs(data.balance);
        });

        // Update Totals
        document.getElementById('total-receivable').innerText = `Rs. ${totalReceivable.toLocaleString()}`;
        document.getElementById('total-payable').innerText = `Rs. ${totalPayable.toLocaleString()}`;

        // Net Balance Calculations
        const net = totalReceivable - totalPayable;
        const netEl = document.getElementById('net-balance');
        const netStatusEl = document.getElementById('net-status');
        const custCountEl = document.getElementById('customer-total-count');

        custCountEl.innerText = `${customersList.length} Customer${customersList.length === 1 ? '' : 's'}`;
        netEl.innerText = `Rs. ${Math.abs(net).toLocaleString()}`;

        if (net > 0) {
          netEl.className = "text-xl font-black text-emerald-600 tracking-tight";
          netStatusEl.innerText = "Net Receivable (+)";
          netStatusEl.className = "text-[10px] font-bold text-emerald-600 mt-0.5";
        } else if (net < 0) {
          netEl.className = "text-xl font-black text-rose-600 tracking-tight";
          netStatusEl.innerText = "Net Payable (-)";
          netStatusEl.className = "text-[10px] font-bold text-rose-600 mt-0.5";
        } else {
          netEl.className = "text-xl font-black text-slate-800 tracking-tight";
          netStatusEl.innerText = "Settled (Nil)";
          netStatusEl.className = "text-[10px] font-bold text-slate-500 mt-0.5";
        }

        renderCustomers();
      }, (err) => console.error("Firestore Error:", err));
    }

    window.renderCustomers = () => {
      const searchVal = document.getElementById('search-input').value.toLowerCase();
      const listDiv = document.getElementById('customer-list');
      listDiv.innerHTML = '';

      let filtered = customersList.filter(c => {
        const matches = c.name.toLowerCase().includes(searchVal) || (c.phone && c.phone.includes(searchVal));
        if (!matches) return false;
        if (currentFilter === 'receivable') return c.balance > 0;
        if (currentFilter === 'payable') return c.balance < 0;
        return true;
      });

      if (filtered.length === 0) {
        listDiv.innerHTML = `
          <div class="py-16 text-center text-gray-400">
            <div class="w-14 h-14 bg-gray-100 rounded-full flex items-center justify-center mx-auto mb-3 text-2xl">📖</div>
            <p class="text-sm font-semibold text-gray-600">No Customers Found</p>
            <p class="text-xs text-gray-400 mt-1">Add a new customer to start your digital ledger</p>
          </div>`;
        return;
      }

      filtered.forEach(cust => {
        const item = document.createElement('div');
        item.className = "p-4 flex justify-between items-center bg-white hover:bg-emerald-50/40 active:scale-[0.99] border-b border-gray-100 cursor-pointer transition";
        item.onclick = () => openCustomerDetail(cust);

        const firstLetter = cust.name ? cust.name.charAt(0).toUpperCase() : 'C';
        const isReceivable = cust.balance > 0;
        const isPayable = cust.balance < 0;

        item.innerHTML = `
          <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-full bg-emerald-100 text-emerald-800 flex items-center justify-center font-bold text-sm shadow-inner">
              ${firstLetter}
            </div>
            <div>
              <h4 class="font-bold text-gray-900 text-sm leading-tight">${cust.name}</h4>
              <p class="text-[11px] text-gray-400 font-medium mt-0.5">${cust.phone || 'No phone number'}</p>
            </div>
          </div>
          <div class="text-right">
            <span class="text-sm font-extrabold ${isReceivable ? 'text-rose-600' : isPayable ? 'text-emerald-600' : 'text-gray-400'}">
              Rs. ${Math.abs(cust.balance || 0).toLocaleString()}
            </span>
            <p class="text-[10px] font-bold tracking-tight uppercase ${isReceivable ? 'text-rose-500' : isPayable ? 'text-emerald-600' : 'text-gray-400'}">
              ${isReceivable ? 'You Will Get' : isPayable ? 'You Will Give' : 'Settled'}
            </p>
          </div>
        `;
        listDiv.appendChild(item);
      });
    };

    window.setFilter = (type) => {
      currentFilter = type;
      ['all', 'receivable', 'payable'].forEach(f => {
        const btn = document.getElementById(`filter-${f}`);
        if (f === type) {
          btn.className = "px-4 py-1.5 rounded-full text-xs font-bold bg-emerald-700 text-white shadow-sm transition";
        } else {
          btn.className = "px-4 py-1.5 rounded-full text-xs font-semibold bg-gray-100 text-gray-600 hover:bg-gray-200 transition";
        }
      });
      renderCustomers();
    };

    window.addNewCustomer = async () => {
      const name = prompt("Enter customer name:");
      if (!name || !name.trim()) return;
      const phone = prompt("Enter customer phone/WhatsApp number:") || "";

      try {
        await addDoc(collection(db, "customers"), {
          userId: currentUser.uid,
          name: name.trim(),
          phone: phone.trim(),
          balance: 0,
          createdAt: new Date().toISOString()
        });
      } catch (err) {
        alert("Failed to create customer: " + err.message);
      }
    };

    window.openCustomerDetail = (cust) => {
      selectedCustomer = cust;
      document.getElementById('modal-cust-name').innerText = cust.name;
      document.getElementById('modal-cust-phone').innerText = cust.phone || 'No phone available';
      updateModalBalanceUI();
      clearPhotoAttachment();
      document.getElementById('tx-modal').classList.remove('hidden');
      loadCustomerTransactions(cust.id);
    };

    function updateModalBalanceUI() {
      const bal = selectedCustomer.balance || 0;
      const statusText = bal > 0 ? 'You Will Get' : bal < 0 ? 'You Will Give' : 'Settled';
      const balEl = document.getElementById('modal-cust-balance');
      balEl.innerText = `Rs. ${Math.abs(bal).toLocaleString()} (${statusText})`;
      balEl.className = `text-xs font-bold mt-1 px-2.5 py-1 rounded-md inline-block ${bal > 0 ? 'bg-rose-50 text-rose-600' : bal < 0 ? 'bg-emerald-50 text-emerald-600' : 'bg-gray-100 text-gray-600'}`;
    }

    function loadCustomerTransactions(customerId) {
      const txListEl = document.getElementById('tx-history-list');
      txListEl.innerHTML = '<p class="text-xs text-gray-400 text-center py-4">Loading transactions...</p>';

      if (unsubscribeTx) unsubscribeTx();

      const q = query(collection(db, "transactions"), where("customerId", "==", customerId));
      unsubscribeTx = onSnapshot(q, (snapshot) => {
        currentTransactions = [];
        snapshot.forEach(docSnap => currentTransactions.push({ id: docSnap.id, ...docSnap.data() }));
        currentTransactions.sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
        renderTransactions();
      });
    }

    function renderTransactions() {
      const txListEl = document.getElementById('tx-history-list');
      txListEl.innerHTML = '';

      if (currentTransactions.length === 0) {
        txListEl.innerHTML = '<p class="text-xs text-gray-400 text-center py-8">No transactions recorded yet.</p>';
        return;
      }

      currentTransactions.forEach(t => {
        const row = document.createElement('div');
        row.className = "flex justify-between items-center p-3 rounded-xl bg-gray-50/70 border border-gray-100";
        const dateStr = new Date(t.createdAt).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
        const isGiven = t.type === 'diye';

        const photoIcon = t.receiptImage ? `<button onclick="window.viewImage('${t.receiptImage}')" class="text-[10px] bg-white border border-gray-200 px-2 py-0.5 rounded-md font-bold text-gray-700 shadow-sm ml-2">📷 Bill</button>` : '';

        row.innerHTML = `
          <div>
            <div class="flex items-center">
              <span class="font-bold text-gray-800 text-xs">${t.note || (isGiven ? 'Given (Debit)' : 'Received (Credit)')}</span>
              ${photoIcon}
            </div>
            <p class="text-[10px] text-gray-400 mt-0.5">${dateStr}</p>
          </div>
          <div class="text-right">
            <span class="font-extrabold text-xs ${isGiven ? 'text-rose-600' : 'text-emerald-600'}">
              ${isGiven ? '-' : '+'} Rs. ${Number(t.amount).toLocaleString()}
            </span>
          </div>
        `;
        txListEl.appendChild(row);
      });
    }

    window.closeModal = () => {
      document.getElementById('tx-modal').classList.add('hidden');
      if (unsubscribeTx) unsubscribeTx();
    };

    window.addTransaction = async (type) => {
      const amountInput = document.getElementById('tx-amount');
      const noteInput = document.getElementById('tx-note');
      const amount = parseFloat(amountInput.value);

      if (!amount || amount <= 0) {
        alert("Please enter a valid amount");
        return;
      }

      const balanceDiff = (type === 'diye') ? amount : -amount;
      const newBal = (selectedCustomer.balance || 0) + balanceDiff;

      try {
        await updateDoc(doc(db, "customers", selectedCustomer.id), { balance: newBal });
        await addDoc(collection(db, "transactions"), {
          userId: currentUser.uid,
          customerId: selectedCustomer.id,
          type: type,
          amount: amount,
          note: noteInput.value.trim(),
          receiptImage: attachedPhotoBase64 || "",
          createdAt: new Date().toISOString()
        });

        selectedCustomer.balance = newBal;
        updateModalBalanceUI();
        amountInput.value = '';
        noteInput.value = '';
        clearPhotoAttachment();
      } catch (err) {
        alert("Error saving transaction: " + err.message);
      }
    };

    window.handleReceiptUpload = (event) => {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (e) => {
        const img = new Image();
        img.onload = () => {
          const canvas = document.createElement('canvas');
          const maxDim = 800;
          let width = img.width, height = img.height;
          if (width > height && width > maxDim) {
            height = Math.round((height * maxDim) / width);
            width = maxDim;
          } else if (height > maxDim) {
            width = Math.round((width * maxDim) / height);
            height = maxDim;
          }
          canvas.width = width;
          canvas.height = height;
          canvas.getContext('2d').drawImage(img, 0, 0, width, height);

          attachedPhotoBase64 = canvas.toDataURL('image/jpeg', 0.65);
          document.getElementById('photo-preview-container').classList.remove('hidden');
          document.getElementById('photo-preview-thumb').src = attachedPhotoBase64;
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    };

    window.clearPhotoAttachment = () => {
      attachedPhotoBase64 = "";
      const input = document.getElementById('receipt-camera-input');
      if (input) input.value = "";
      document.getElementById('photo-preview-container').classList.add('hidden');
    };

    window.viewImage = (base64) => {
      const w = window.open("");
      w.document.write(`<img src="${base64}" style="max-width:92%; margin:30px auto; display:block; border-radius:16px; box-shadow:0 12px 30px rgba(0,0,0,0.15);">`);
    };

    window.startSpeechRecognition = () => {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) {
        alert("Your browser does not support voice recognition. Please use Google Chrome or Safari.");
        return;
      }
      const recognition = new SpeechRecognition();
      recognition.lang = 'en-US';
      const micBtn = document.getElementById('mic-btn');
      micBtn.classList.add('bg-rose-500', 'text-white', 'animate-pulse');

      recognition.onresult = (event) => {
        const noteInput = document.getElementById('tx-note');
        noteInput.value = (noteInput.value ? noteInput.value + ' ' : '') + event.results[0][0].transcript;
      };
      recognition.onend = () => micBtn.classList.remove('bg-rose-500', 'text-white', 'animate-pulse');
      recognition.start();
    };

    window.deleteCustomer = async () => {
      if (!confirm(`Are you sure you want to delete ${selectedCustomer.name}'s account? All records will be removed.`)) return;
      try {
        await deleteDoc(doc(db, "customers", selectedCustomer.id));
        closeModal();
      } catch (err) {
        alert("Error: " + err.message);
      }
    };

    window.sendWhatsApp = () => {
      if (!selectedCustomer || !selectedCustomer.phone) {
        alert("Customer phone number is not available.");
        return;
      }
      let phone = selectedCustomer.phone.replace(/[^0-9]/g, '');
      if (phone.startsWith('0')) phone = '92' + phone.substring(1);
      const bal = selectedCustomer.balance || 0;
      const statusText = bal >= 0 ? 'Pending to pay' : 'Advance balance';
      const msg = `Dear ${selectedCustomer.name},\nAccording to GG Digi Book records, your current ledger balance is Rs. ${Math.abs(bal).toLocaleString()} (${statusText}).\nPlease review and confirm. Thank you!`;
      window.open(`https://wa.me/${phone}?text=${encodeURIComponent(msg)}`, '_blank');
    };

    window.downloadPDF = () => {
      const { jsPDF } = window.jspdf;
      const pdf = new jsPDF();

      pdf.setFontSize(18);
      pdf.setTextColor(5, 150, 105);
      pdf.text("GG Digi Book - Ledger Statement", 14, 20);

      pdf.setFontSize(10);
      pdf.setTextColor(80, 80, 80);
      pdf.text(`Customer Name: ${selectedCustomer.name}`, 14, 29);
      pdf.text(`Phone: ${selectedCustomer.phone || 'N/A'}`, 14, 35);
      pdf.text(`Date: ${new Date().toLocaleDateString('en-GB')}`, 14, 41);

      const balStatus = selectedCustomer.balance >= 0 ? 'Receivable' : 'Payable';
      const balText = `Current Balance: Rs. ${Math.abs(selectedCustomer.balance || 0).toLocaleString()} (${balStatus})`;
      pdf.setFontSize(11);
      pdf.setTextColor(selectedCustomer.balance >= 0 ? 225 : 5, selectedCustomer.balance >= 0 ? 29 : 150, selectedCustomer.balance >= 0 ? 72 : 105);
      pdf.text(balText, 14, 48);

      const sortedTx = [...currentTransactions].sort((a, b) => new Date(a.createdAt) - new Date(b.createdAt));
      let runningBal = 0;
      const tableData = sortedTx.map(t => {
        const isGiven = t.type === 'diye';
        runningBal += isGiven ? Number(t.amount) : -Number(t.amount);
        let noteText = t.note || (isGiven ? 'Given (Debit)' : 'Received (Credit)');
        if (!/^[\x00-\x7F]*$/.test(noteText)) {
          noteText = isGiven ? 'Given (Debit)' : 'Received (Credit)';
        }
        return [
          new Date(t.createdAt).toLocaleDateString('en-GB'),
          noteText,
          isGiven ? `Rs. ${Number(t.amount).toLocaleString()}` : '-',
          !isGiven ? `Rs. ${Number(t.amount).toLocaleString()}` : '-',
          `Rs. ${Math.abs(runningBal).toLocaleString()} ${runningBal >= 0 ? '(Rec)' : '(Pay)'}`
        ];
      });

      pdf.autoTable({
        startY: 53,
        head: [['Date', 'Description', 'Given (Debit)', 'Received (Credit)', 'Balance']],
        body: tableData,
        theme: 'striped',
        headStyles: { fillColor: [5, 150, 105] },
        styles: { fontSize: 8.5 }
      });

      pdf.save(`${selectedCustomer.name}_Ledger.pdf`);
    };
  </script>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800 antialiased selection:bg-emerald-500 selection:text-white">

  <!-- 1. LOGIN SCREEN -->
  <div id="login-screen" class="flex flex-col items-center justify-center min-h-screen p-5 bg-gradient-to-b from-emerald-50/60 to-slate-100">
    <div class="glass-card p-8 rounded-3xl shadow-2xl max-w-sm w-full text-center border border-white">
      <div class="relative inline-block mb-4">
        <img src="logo.png" alt="GG Digi Book" class="w-24 h-24 rounded-full mx-auto object-contain shadow-lg bg-white p-1 ring-4 ring-emerald-50">
      </div>
      <h2 class="text-2xl font-extrabold text-slate-900 tracking-tight">GG Digi Book</h2>
      <p class="text-xs text-slate-500 font-medium mt-1 mb-8">Your Secure Cloud Ledger Book</p>
      
      <button onclick="loginGoogle()" class="w-full py-3.5 px-4 bg-white hover:bg-slate-50 active:scale-[0.98] border border-slate-200 text-slate-700 font-bold rounded-2xl shadow-sm flex items-center justify-center gap-3 transition">
        <svg class="w-5 h-5" viewBox="0 0 24 24">
          <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
          <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
          <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
          <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
        </svg>
        Sign in with Google
      </button>
    </div>
  </div>

  <!-- 2. MAIN APP SCREEN -->
  <div id="app-screen" class="hidden max-w-md mx-auto bg-white min-h-screen shadow-2xl flex flex-col relative border-x border-slate-100">
    <!-- Header -->
    <header class="bg-gradient-to-r from-emerald-800 to-emerald-700 text-white p-4 flex justify-between items-center shadow-lg sticky top-0 z-20">
      <div class="flex items-center gap-3">
        <img src="logo.png" alt="GG Logo" class="w-10 h-10 rounded-full bg-white p-0.5 object-contain shadow-md ring-2 ring-emerald-400/30">
        <div>
          <h1 class="text-sm font-extrabold tracking-tight leading-tight">GG Digi Book</h1>
          <p id="user-name" class="text-[11px] text-emerald-200/90 font-medium truncate max-w-[160px]"></p>
        </div>
      </div>
      <button onclick="logout()" class="text-[11px] font-bold bg-emerald-900/60 hover:bg-emerald-900 active:scale-95 px-3 py-1.5 rounded-xl border border-emerald-600/50 shadow-sm transition">
        Logout
      </button>
    </header>

    <!-- Net Balance & Summary Card -->
    <div class="p-4 bg-gradient-to-b from-emerald-50/60 to-transparent border-b border-slate-100 space-y-3">
      <!-- Net Balance Highlight -->
      <div class="bg-white p-3.5 rounded-2xl border border-slate-200/80 shadow-sm flex items-center justify-between">
        <div>
          <p class="text-[10px] font-bold text-slate-400 uppercase tracking-wider">Net Balance</p>
          <h2 id="net-balance" class="text-xl font-black text-slate-800 tracking-tight">Rs. 0</h2>
        </div>
        <div class="text-right">
          <span id="customer-total-count" class="inline-block text-[11px] font-bold px-2.5 py-1 rounded-full bg-slate-100 text-slate-600">0 Customers</span>
          <p id="net-status" class="text-[10px] font-bold text-emerald-600 mt-0.5">Settled</p>
        </div>
      </div>

      <!-- Debit & Credit Grid -->
      <div class="grid grid-cols-2 gap-3">
        <div class="bg-white p-3.5 rounded-2xl border border-rose-100/80 shadow-sm">
          <div class="flex items-center justify-between mb-1">
            <span class="text-[10px] font-bold text-slate-500 uppercase">You Will Get</span>
            <span class="w-2 h-2 rounded-full bg-rose-500"></span>
          </div>
          <h3 id="total-receivable" class="text-base font-black text-rose-600 tracking-tight">Rs. 0</h3>
        </div>
        <div class="bg-white p-3.5 rounded-2xl border border-emerald-100/80 shadow-sm">
          <div class="flex items-center justify-between mb-1">
            <span class="text-[10px] font-bold text-slate-500 uppercase">You Will Give</span>
            <span class="w-2 h-2 rounded-full bg-emerald-500"></span>
          </div>
          <h3 id="total-payable" class="text-base font-black text-emerald-600 tracking-tight">Rs. 0</h3>
        </div>
      </div>
    </div>

    <!-- Search & Filter Controls -->
    <div class="px-4 py-3 bg-white border-b border-slate-100 space-y-2.5">
      <div class="relative">
        <input type="text" id="search-input" oninput="renderCustomers()" placeholder="Search customer by name or phone..." class="w-full bg-slate-50 pl-9 pr-4 py-2.5 text-xs rounded-xl border border-slate-200/80 outline-none focus:ring-2 focus:ring-emerald-500/20 focus:border-emerald-500 transition">
        <span class="absolute left-3 top-3 text-slate-400 text-xs">🔍</span>
      </div>
      <div class="flex gap-2">
        <button id="filter-all" onclick="setFilter('all')" class="px-4 py-1.5 rounded-full text-xs font-bold bg-emerald-700 text-white shadow-sm transition">All</button>
        <button id="filter-receivable" onclick="setFilter('receivable')" class="px-4 py-1.5 rounded-full text-xs font-semibold bg-slate-100 text-slate-600 hover:bg-slate-200 transition">You Will Get</button>
        <button id="filter-payable" onclick="setFilter('payable')" class="px-4 py-1.5 rounded-full text-xs font-semibold bg-slate-100 text-slate-600 hover:bg-slate-200 transition">You Will Give</button>
      </div>
    </div>

    <!-- Customer List -->
    <div id="customer-list" class="flex-1 overflow-y-auto divide-y divide-slate-100"></div>

    <!-- Add Customer Bottom Sticky Bar -->
    <div class="p-4 border-t border-slate-100 sticky bottom-0 bg-white/95 backdrop-blur-md">
      <button onclick="addNewCustomer()" class="w-full py-3.5 bg-emerald-600 hover:bg-emerald-700 active:scale-[0.98] text-white font-bold rounded-2xl shadow-lg shadow-emerald-600/20 flex items-center justify-center gap-2 transition">
        <span class="text-xl leading-none font-black">+</span> Add New Customer
      </button>
    </div>
  </div>

  <!-- 3. CUSTOMER LEDGER MODAL -->
  <div id="tx-modal" class="hidden fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-end sm:items-center justify-center p-0 sm:p-4">
    <div class="bg-white w-full max-w-md max-h-[92vh] rounded-t-3xl sm:rounded-3xl p-5 shadow-2xl flex flex-col overflow-hidden animate-in">
      
      <!-- Modal Header -->
      <div class="flex justify-between items-start pb-3 border-b border-slate-100">
        <div>
          <h3 id="modal-cust-name" class="text-base font-extrabold text-slate-900 leading-tight"></h3>
          <p id="modal-cust-phone" class="text-xs text-slate-400 mt-0.5 font-medium"></p>
          <div id="modal-cust-balance"></div>
        </div>
        <div class="flex items-center gap-1.5">
          <button onclick="deleteCustomer()" title="Delete Customer Ledger" class="p-2 text-rose-500 hover:bg-rose-50 rounded-xl transition">🗑️</button>
          <button onclick="closeModal()" class="text-slate-400 hover:text-slate-700 text-2xl font-bold leading-none p-2">&times;</button>
        </div>
      </div>

      <!-- Transaction History Scrollable -->
      <div class="flex-1 overflow-y-auto my-3 pr-1">
        <div class="flex justify-between items-center mb-2.5">
          <h5 class="text-[11px] font-extrabold text-slate-400 uppercase tracking-wider">Transaction History</h5>
        </div>
        <div id="tx-history-list" class="space-y-1.5"></div>
      </div>

      <!-- Entry Form & Actions -->
      <div class="pt-3 border-t border-slate-100 bg-slate-50/80 -mx-5 -mb-5 p-5 rounded-b-3xl space-y-3">
        
        <!-- Photo Preview -->
        <div id="photo-preview-container" class="hidden flex items-center justify-between bg-white border border-emerald-200 p-2 rounded-xl shadow-sm">
          <div class="flex items-center gap-2">
            <img id="photo-preview-thumb" class="w-8 h-8 rounded-lg object-cover border border-emerald-300" src="">
            <span class="text-xs font-bold text-emerald-800">Bill Photo Attached ✅</span>
          </div>
          <button onclick="clearPhotoAttachment()" class="text-xs text-rose-600 font-bold px-2 py-1 hover:bg-rose-50 rounded">Remove</button>
        </div>

        <div class="grid grid-cols-2 gap-2">
          <input type="number" id="tx-amount" placeholder="Amount (Rs.)" class="w-full text-sm font-bold p-2.5 bg-white border border-slate-200 rounded-xl focus:ring-2 focus:ring-emerald-500/20 focus:border-emerald-500 outline-none">
          
          <div class="relative flex items-center">
            <input type="text" id="tx-note" placeholder="Note / Description" class="w-full text-xs p-2.5 pr-14 bg-white border border-slate-200 rounded-xl focus:ring-2 focus:ring-emerald-500/20 focus:border-emerald-500 outline-none">
            <div class="absolute right-1.5 flex items-center gap-1">
              <button id="mic-btn" onclick="startSpeechRecognition()" title="Voice to Text" class="p-1 rounded-lg text-slate-400 hover:text-emerald-700 text-sm transition">🎙️</button>
              <label for="receipt-camera-input" title="Attach Receipt/Bill" class="p-1 rounded-lg text-slate-400 hover:text-emerald-700 text-sm cursor-pointer transition">📸</label>
              <input id="receipt-camera-input" type="file" accept="image/*" capture="environment" onchange="handleReceiptUpload(event)" class="hidden">
            </div>
          </div>
        </div>

        <div class="grid grid-cols-2 gap-2">
          <button onclick="addTransaction('diye')" class="py-2.5 bg-rose-600 hover:bg-rose-700 active:scale-95 text-white text-xs font-bold rounded-xl shadow-md shadow-rose-600/10 transition">
            - You Gave (Debit)
          </button>
          <button onclick="addTransaction('liye')" class="py-2.5 bg-emerald-600 hover:bg-emerald-700 active:scale-95 text-white text-xs font-bold rounded-xl shadow-md shadow-emerald-600/10 transition">
            + You Got (Credit)
          </button>
        </div>

        <div class="grid grid-cols-2 gap-2 pt-1">
          <button onclick="sendWhatsApp()" class="py-2 bg-emerald-50 text-emerald-800 border border-emerald-200 font-bold rounded-xl flex items-center justify-center gap-1.5 text-xs hover:bg-emerald-100 transition">
            <span>💬</span> WhatsApp Reminder
          </button>
          <button onclick="downloadPDF()" class="py-2 bg-white text-slate-700 border border-slate-200 font-bold rounded-xl flex items-center justify-center gap-1.5 text-xs hover:bg-slate-100 transition shadow-sm">
            <span>📄</span> PDF Statement
          </button>
        </div>
      </div>

    </div>
  </div>

</body>
</html>
