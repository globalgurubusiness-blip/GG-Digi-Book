<!DOCTYPE html>
<html lang="ur" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GG Digi Book - Udhaar Khata</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <!-- jsPDF for PDF Statement Downloads -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>

  <style>
    body { font-family: 'Noto Sans', sans-serif; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>

  <!-- Firebase SDKs -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { 
      getAuth, signInWithPopup, GoogleAuthProvider, signOut, onAuthStateChanged 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { 
      getFirestore, collection, addDoc, onSnapshot, query, where, doc, updateDoc, deleteDoc 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // Firebase Configuration
    const firebaseConfig = {
      apiKey: "AIzaSyBnzL_AKXDZFE6feQJf5XnasBqcLey0uOs",
      authDomain: "gg-digi-book.firebaseapp.com",
      projectId: "gg-digi-book",
      storageBucket: "gg-digi-book.firebasestorage.app",
      messagingSenderId: "384507968962",
      appId: "1:384507968962:web:89df71ed5ed5bc8656aa5b",
      measurementId: "G-491D264LFB"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const provider = new GoogleAuthProvider();

    let currentUser = null;
    let customersList = [];
    let currentFilter = 'all';
    let selectedCustomer = null;
    let currentTransactions = [];
    let unsubscribeTx = null;
    let attachedPhotoBase64 = "";

    // Auth State
    onAuthStateChanged(auth, (user) => {
      currentUser = user;
      if (user) {
        document.getElementById('login-screen').classList.add('hidden');
        document.getElementById('app-screen').classList.remove('hidden');
        document.getElementById('user-name').innerText = user.displayName || user.email;
        loadCustomers();
      } else {
        document.getElementById('login-screen').classList.remove('hidden');
        document.getElementById('app-screen').classList.add('hidden');
      }
    });

    window.loginGoogle = () => {
      signInWithPopup(auth, provider).catch(err => alert("Login Error: " + err.message));
    };
    window.logout = () => signOut(auth);

    // Load Customers Live
    function loadCustomers() {
      const q = query(collection(db, "customers"), where("userId", "==", currentUser.uid));
      onSnapshot(q, (snapshot) => {
        customersList = [];
        let totalReceivable = 0;
        let totalPayable = 0;

        snapshot.forEach((docSnap) => {
          const data = { id: docSnap.id, ...docSnap.data() };
          customersList.push(data);
          if (data.balance > 0) totalReceivable += data.balance;
          if (data.balance < 0) totalPayable += Math.abs(data.balance);
        });

        document.getElementById('total-lena').innerText = `Rs. ${totalReceivable.toLocaleString()}`;
        document.getElementById('total-dena').innerText = `Rs. ${totalPayable.toLocaleString()}`;
        renderCustomers();
      }, (err) => {
        console.error("Firestore Error:", err);
      });
    }

    // Render Filtered Customers
    window.renderCustomers = () => {
      const searchVal = document.getElementById('search-input').value.toLowerCase();
      const listDiv = document.getElementById('customer-list');
      listDiv.innerHTML = '';

      let filtered = customersList.filter(c => {
        const matchesSearch = c.name.toLowerCase().includes(searchVal) || (c.phone && c.phone.includes(searchVal));
        if (!matchesSearch) return false;
        if (currentFilter === 'lena') return c.balance > 0;
        if (currentFilter === 'dena') return c.balance < 0;
        return true;
      });

      if (filtered.length === 0) {
        listDiv.innerHTML = `<div class="p-12 text-center text-gray-400 text-sm font-medium">Koi customer nahi mila.<br>Naya khata shamil karein.</div>`;
        return;
      }

      filtered.forEach(cust => {
        const item = document.createElement('div');
        item.className = "p-4 border-b flex justify-between items-center hover:bg-gray-50 active:bg-gray-100 cursor-pointer transition select-none";
        item.onclick = () => openCustomerDetail(cust);

        item.innerHTML = `
          <div>
            <h4 class="font-bold text-gray-900 text-base leading-tight">${cust.name}</h4>
            <p class="text-xs text-gray-500 mt-0.5">${cust.phone || 'Phone mojood nahi'}</p>
          </div>
          <div class="text-right">
            <span class="text-base font-extrabold ${cust.balance > 0 ? 'text-red-600' : cust.balance < 0 ? 'text-emerald-600' : 'text-gray-500'}">
              Rs. ${Math.abs(cust.balance || 0).toLocaleString()}
            </span>
            <p class="text-[11px] font-semibold ${cust.balance > 0 ? 'text-red-500' : cust.balance < 0 ? 'text-emerald-600' : 'text-gray-400'}">
              ${cust.balance > 0 ? 'Maine Lena Hai' : cust.balance < 0 ? 'Maine Dena Hai' : 'Hisaab Nil'}
            </p>
          </div>
        `;
        listDiv.appendChild(item);
      });
    };

    window.setFilter = (type) => {
      currentFilter = type;
      ['all', 'lena', 'dena'].forEach(f => {
        const btn = document.getElementById(`filter-${f}`);
        if (f === type) {
          btn.className = "px-3 py-1.5 rounded-full text-xs font-bold bg-emerald-700 text-white shadow-sm transition";
        } else {
          btn.className = "px-3 py-1.5 rounded-full text-xs font-semibold bg-white text-gray-600 border border-gray-200 transition";
        }
      });
      renderCustomers();
    };

    window.addNewCustomer = async () => {
      const name = prompt("Customer ka naam:");
      if (!name || !name.trim()) return;
      const phone = prompt("Customer ka Mobile Number (WhatsApp ke liye):") || "";

      try {
        await addDoc(collection(db, "customers"), {
          userId: currentUser.uid,
          name: name.trim(),
          phone: phone.trim(),
          balance: 0,
          createdAt: new Date().toISOString()
        });
      } catch (err) {
        alert("Khata banane mein masla hua: " + err.message);
      }
    };

    window.openCustomerDetail = (cust) => {
      selectedCustomer = cust;
      document.getElementById('modal-cust-name').innerText = cust.name;
      document.getElementById('modal-cust-phone').innerText = cust.phone || 'Phone number nahi hai';
      updateModalBalanceUI();
      clearPhotoAttachment();
      document.getElementById('tx-modal').classList.remove('hidden');
      loadCustomerTransactions(cust.id);
    };

    function updateModalBalanceUI() {
      const bal = selectedCustomer.balance || 0;
      const statusText = bal > 0 ? 'Maine Lena Hai' : bal < 0 ? 'Maine Dena Hai' : 'Hisaab Saaf Hai';
      const balEl = document.getElementById('modal-cust-balance');
      balEl.innerText = `Rs. ${Math.abs(bal).toLocaleString()} (${statusText})`;
      balEl.className = `text-sm font-bold ${bal > 0 ? 'text-red-600' : bal < 0 ? 'text-emerald-600' : 'text-gray-500'}`;
    }

    function loadCustomerTransactions(customerId) {
      const txListEl = document.getElementById('tx-history-list');
      txListEl.innerHTML = '<p class="text-xs text-gray-400 text-center py-4">History load ho rahi hai...</p>';

      if (unsubscribeTx) unsubscribeTx();

      const q = query(collection(db, "transactions"), where("customerId", "==", customerId));
      unsubscribeTx = onSnapshot(q, (snapshot) => {
        currentTransactions = [];
        snapshot.forEach(docSnap => {
          currentTransactions.push({ id: docSnap.id, ...docSnap.data() });
        });
        currentTransactions.sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
        renderTransactions();
      });
    }

    function renderTransactions() {
      const txListEl = document.getElementById('tx-history-list');
      txListEl.innerHTML = '';

      if (currentTransactions.length === 0) {
        txListEl.innerHTML = '<p class="text-xs text-gray-400 text-center py-6">Abhi koi len den record nahi hua.</p>';
        return;
      }

      currentTransactions.forEach(t => {
        const row = document.createElement('div');
        row.className = "flex justify-between items-center py-2.5 border-b border-gray-100 text-xs";
        const dateStr = new Date(t.createdAt).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
        const isDiye = t.type === 'diye';

        const photoIcon = t.receiptImage ? `<button onclick="window.viewImage('${t.receiptImage}')" class="text-xs bg-emerald-50 text-emerald-700 px-1.5 py-0.5 rounded border border-emerald-200 ml-1.5 font-bold">📷 Bill</button>` : '';

        row.innerHTML = `
          <div>
            <div class="flex items-center">
              <span class="font-bold text-gray-800">${t.note || (isDiye ? 'Udhaar Diya' : 'Raqam Wasool Hui')}</span>
              ${photoIcon}
            </div>
            <p class="text-[10px] text-gray-400 mt-0.5">${dateStr}</p>
          </div>
          <div class="text-right">
            <span class="font-extrabold ${isDiye ? 'text-red-600' : 'text-emerald-600'}">
              ${isDiye ? '-' : '+'} Rs. ${Number(t.amount).toLocaleString()}
            </span>
          </div>
        `;
        txListEl.appendChild(row);
      });
    }

    window.closeModal = () => {
      document.getElementById('tx-modal').classList.add('hidden');
      if (unsubscribeTx) unsubscribeTx();
    };

    // Add Transaction
    window.addTransaction = async (type) => {
      const amountInput = document.getElementById('tx-amount');
      const noteInput = document.getElementById('tx-note');
      const amount = parseFloat(amountInput.value);

      if (!amount || amount <= 0) {
        alert("Durust raqam darj karein");
        return;
      }

      const balanceDiff = (type === 'diye') ? amount : -amount;
      const newBal = (selectedCustomer.balance || 0) + balanceDiff;

      try {
        await updateDoc(doc(db, "customers", selectedCustomer.id), {
          balance: newBal
        });

        await addDoc(collection(db, "transactions"), {
          userId: currentUser.uid,
          customerId: selectedCustomer.id,
          type: type,
          amount: amount,
          note: noteInput.value.trim(),
          receiptImage: attachedPhotoBase64 || "",
          createdAt: new Date().toISOString()
        });

        selectedCustomer.balance = newBal;
        updateModalBalanceUI();
        amountInput.value = '';
        noteInput.value = '';
        clearPhotoAttachment();
      } catch (err) {
        alert("Entry save nahi ho saki: " + err.message);
      }
    };

    // Camera Image Compression & Attachment
    window.handleReceiptUpload = (event) => {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (e) => {
        const img = new Image();
        img.onload = () => {
          const canvas = document.createElement('canvas');
          const maxDim = 800; // Compress to max 800px width/height
          let width = img.width;
          let height = img.height;

          if (width > height && width > maxDim) {
            height = Math.round((height * maxDim) / width);
            width = maxDim;
          } else if (height > maxDim) {
            width = Math.round((width * maxDim) / height);
            height = maxDim;
          }

          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, width, height);

          attachedPhotoBase64 = canvas.toDataURL('image/jpeg', 0.65);
          document.getElementById('photo-preview-container').classList.remove('hidden');
          document.getElementById('photo-preview-thumb').src = attachedPhotoBase64;
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    };

    window.clearPhotoAttachment = () => {
      attachedPhotoBase64 = "";
      const input = document.getElementById('receipt-camera-input');
      if (input) input.value = "";
      document.getElementById('photo-preview-container').classList.add('hidden');
    };

    window.viewImage = (base64) => {
      const w = window.open("");
      w.document.write(`<img src="${base64}" style="max-width:100%; height:auto; margin:20px auto; display:block; border-radius:12px; box-shadow:0 10px 25px rgba(0,0,0,0.2);">`);
    };

    // Voice to Text (Urdu / English)
    window.startSpeechRecognition = () => {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) {
        alert("Aapka browser voice recognition support nahi karta. Chrome ya Safari use karein.");
        return;
      }

      const recognition = new SpeechRecognition();
      recognition.lang = 'ur-PK'; // Urdu (Pakistan)
      const micBtn = document.getElementById('mic-btn');
      micBtn.classList.add('bg-red-500', 'text-white', 'animate-pulse');

      recognition.onresult = (event) => {
        const transcript = event.results[0][0].transcript;
        const noteInput = document.getElementById('tx-note');
        noteInput.value = (noteInput.value ? noteInput.value + ' ' : '') + transcript;
      };

      recognition.onerror = () => {
        // Fallback to English if Urdu fails
        recognition.lang = 'en-US';
      };

      recognition.onend = () => {
        micBtn.classList.remove('bg-red-500', 'text-white', 'animate-pulse');
      };

      recognition.start();
    };

    // Delete Customer
    window.deleteCustomer = async () => {
      if (!confirm(`Kya aap waqai ${selectedCustomer.name} ka khata delete karna chahte hain?`)) return;
      try {
        await deleteDoc(doc(db, "customers", selectedCustomer.id));
        closeModal();
      } catch (err) {
        alert("Delete karne mein masla hua: " + err.message);
      }
    };

    // WhatsApp Reminder
    window.sendWhatsApp = () => {
      if (!selectedCustomer || !selectedCustomer.phone) {
        alert("Customer ka mobile number mojood nahi hai.");
        return;
      }
      let phone = selectedCustomer.phone.replace(/[^0-9]/g, '');
      if (phone.startsWith('0')) phone = '92' + phone.substring(1);

      const bal = selectedCustomer.balance || 0;
      const msg = `Assalam-o-Alaikum ${selectedCustomer.name} sahib,\nGG Digi Book khate ke mutabiq aap ka baqi hisaab Rs. ${Math.abs(bal).toLocaleString()} (${bal >= 0 ? 'Aap ne ada karna hai' : 'Hum ne ada karna hai'}) hai.\nBaraye meherbani tasdeeq karein. Shukriya!`;
      window.open(`https://wa.me/${phone}?text=${encodeURIComponent(msg)}`, '_blank');
    };

    // Download PDF
    window.downloadPDF = () => {
      const { jsPDF } = window.jspdf;
      const pdf = new jsPDF();

      pdf.setFontSize(18);
      pdf.setTextColor(4, 120, 87);
      pdf.text("GG Digi Book - Khata Statement", 14, 20);

      pdf.setFontSize(11);
      pdf.setTextColor(60, 60, 60);
      pdf.text(`Customer Name: ${selectedCustomer.name}`, 14, 30);
      pdf.text(`Phone: ${selectedCustomer.phone || 'N/A'}`, 14, 36);
      pdf.text(`Tareekh: ${new Date().toLocaleDateString('en-GB')}`, 14, 42);

      const balText = `Baqi Balance: Rs. ${Math.abs(selectedCustomer.balance || 0).toLocaleString()} (${selectedCustomer.balance >= 0 ? 'Maine Lena Hai' : 'Maine Dena Hai'})`;
      pdf.setFontSize(12);
      pdf.setTextColor(selectedCustomer.balance >= 0 ? 220 : 16, selectedCustomer.balance >= 0 ? 38 : 149, selectedCustomer.balance >= 0 ? 38 : 106);
      pdf.text(balText, 14, 50);

      const tableData = currentTransactions.map(t => [
        new Date(t.createdAt).toLocaleDateString('en-GB'),
        t.note || (t.type === 'diye' ? 'Udhaar Diya' : 'Wasool Huay'),
        t.type === 'diye' ? `Rs. ${t.amount.toLocaleString()}` : '-',
        t.type === 'liye' ? `Rs. ${t.amount.toLocaleString()}` : '-'
      ]);

      pdf.autoTable({
        startY: 56,
        head: [['Tareekh', 'Tafseel', 'Diye (Debit)', 'Liye (Credit)']],
        body: tableData,
        theme: 'striped',
        headStyles: { fillColor: [4, 120, 87] }
      });

      pdf.save(`${selectedCustomer.name}_Ledger.pdf`);
    };
  </script>
</head>
<body class="bg-gray-100 min-h-screen select-none text-gray-800">

  <!-- 1. LOGIN SCREEN -->
  <div id="login-screen" class="flex flex-col items-center justify-center min-h-screen p-4">
    <div class="bg-white p-8 rounded-3xl shadow-xl max-w-sm w-full text-center border border-gray-100">
      <img src="logo.png" alt="GG Digi Book" class="w-24 h-24 rounded-full mx-auto mb-4 object-contain shadow-md bg-white p-1">
      <h2 class="text-2xl font-bold text-gray-900 mb-1">GG Digi Book</h2>
      <p class="text-xs text-gray-500 mb-6">Aapka digital udhaar bahi-khata. Har device par hamesha mehfooz.</p>
      
      <button onclick="loginGoogle()" class="w-full py-3.5 px-4 bg-white border border-gray-300 hover:bg-gray-50 text-gray-700 font-semibold rounded-2xl shadow-sm flex items-center justify-center gap-3 transition">
        <svg class="w-5 h-5" viewBox="0 0 24 24">
          <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
          <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
          <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
          <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
        </svg>
        Google Se Login Karein
      </button>
    </div>
  </div>

  <!-- 2. MAIN APP SCREEN -->
  <div id="app-screen" class="hidden max-w-md mx-auto bg-white min-h-screen shadow-xl flex flex-col">
    <!-- Top Header -->
    <header class="bg-emerald-700 text-white p-4 flex justify-between items-center shadow sticky top-0 z-20">
      <div class="flex items-center gap-2.5">
        <img src="logo.png" alt="GG Logo" class="w-10 h-10 rounded-full bg-white p-0.5 object-contain shadow-sm">
        <div>
          <h1 class="text-base font-bold leading-tight">GG Digi Book</h1>
          <p id="user-name" class="text-xs text-emerald-100 truncate max-w-[170px]"></p>
        </div>
      </div>
      <button onclick="logout()" class="text-xs bg-emerald-800 hover:bg-emerald-900 px-3 py-1.5 rounded-lg border border-emerald-600 transition">
        Logout
      </button>
    </header>

    <!-- Lena / Dena Card -->
    <div class="grid grid-cols-2 gap-3 p-4 bg-emerald-50/70 border-b">
      <div class="bg-white p-3 rounded-2xl border border-red-100 shadow-sm">
        <p class="text-xs font-semibold text-gray-500 mb-1">Maine Lena Hai</p>
        <h3 id="total-lena" class="text-lg font-black text-red-600">Rs. 0</h3>
      </div>
      <div class="bg-white p-3 rounded-2xl border border-emerald-100 shadow-sm">
        <p class="text-xs font-semibold text-gray-500 mb-1">Maine Dena Hai</p>
        <h3 id="total-dena" class="text-lg font-black text-emerald-600">Rs. 0</h3>
      </div>
    </div>

    <!-- Search & Filter Controls -->
    <div class="p-3 bg-white border-b space-y-2.5">
      <div class="relative">
        <input type="text" id="search-input" oninput="renderCustomers()" placeholder="Customer dhoondein (naam ya number)..." class="w-full bg-gray-50 pl-9 pr-3 py-2 text-xs rounded-xl border border-gray-200 outline-none focus:ring-1 focus:ring-emerald-500">
        <span class="absolute left-3 top-2.5 text-gray-400 text-xs">🔍</span>
      </div>
      <div class="flex gap-2">
        <button id="filter-all" onclick="setFilter('all')" class="px-3 py-1.5 rounded-full text-xs font-bold bg-emerald-700 text-white shadow-sm transition">Sabhi</button>
        <button id="filter-lena" onclick="setFilter('lena')" class="px-3 py-1.5 rounded-full text-xs font-semibold bg-white text-gray-600 border border-gray-200 transition">Lena Hai</button>
        <button id="filter-dena" onclick="setFilter('dena')" class="px-3 py-1.5 rounded-full text-xs font-semibold bg-white text-gray-600 border border-gray-200 transition">Dena Hai</button>
      </div>
    </div>

    <!-- Customer List -->
    <div id="customer-list" class="flex-1 overflow-y-auto divide-y divide-gray-100"></div>

    <!-- Add Button Bottom Bar -->
    <div class="p-4 border-t sticky bottom-0 bg-white">
      <button onclick="addNewCustomer()" class="w-full py-3.5 bg-emerald-600 hover:bg-emerald-700 active:scale-[0.99] text-white font-bold rounded-2xl shadow-lg flex items-center justify-center gap-2 transition">
        <span class="text-xl leading-none">+</span> Naya Customer Shamil Karein
      </button>
    </div>
  </div>

  <!-- 3. CUSTOMER LEDGER & TRANSACTION MODAL -->
  <div id="tx-modal" class="hidden fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-end sm:items-center justify-center">
    <div class="bg-white w-full max-w-md max-h-[92vh] rounded-t-3xl sm:rounded-3xl p-5 shadow-2xl flex flex-col animate-in overflow-hidden">
      
      <!-- Modal Header -->
      <div class="flex justify-between items-start pb-3 border-b">
        <div>
          <h3 id="modal-cust-name" class="text-lg font-bold text-gray-900 leading-tight"></h3>
          <p id="modal-cust-phone" class="text-xs text-gray-400 mt-0.5"></p>
          <div id="modal-cust-balance" class="mt-1"></div>
        </div>
        <div class="flex items-center gap-2">
          <button onclick="deleteCustomer()" title="Khata Khatam Karein" class="text-red-500 hover:bg-red-50 p-2 rounded-lg text-sm">🗑️</button>
          <button onclick="closeModal()" class="text-gray-400 hover:text-gray-700 text-2xl font-bold leading-none p-1">&times;</button>
        </div>
      </div>

      <!-- Transaction History Scrollable -->
      <div class="flex-1 overflow-y-auto my-3 pr-1">
        <h5 class="text-[11px] font-bold text-gray-400 uppercase tracking-wider mb-2">Len Den Record</h5>
        <div id="tx-history-list" class="space-y-1"></div>
      </div>

      <!-- Entry Form -->
      <div class="pt-3 border-t bg-gray-50 -mx-5 -mb-5 p-5 rounded-b-3xl space-y-3">
        
        <!-- Photo Preview Banner -->
        <div id="photo-preview-container" class="hidden flex items-center justify-between bg-emerald-50 border border-emerald-200 p-2 rounded-xl">
          <div class="flex items-center gap-2">
            <img id="photo-preview-thumb" class="w-8 h-8 rounded object-cover border border-emerald-300" src="">
            <span class="text-xs font-semibold text-emerald-800">Bill Photo Attached ✅</span>
          </div>
          <button onclick="clearPhotoAttachment()" class="text-xs text-red-600 font-bold px-2 py-1 hover:bg-red-50 rounded">Hataein</button>
        </div>

        <div class="grid grid-cols-2 gap-2">
          <input type="number" id="tx-amount" placeholder="Raqam (Rs.)" class="w-full text-base font-bold p-2.5 bg-white border border-gray-200 rounded-xl focus:ring-2 focus:ring-emerald-500 outline-none">
          
          <!-- Note with Mic and Camera -->
          <div class="relative flex items-center">
            <input type="text" id="tx-note" placeholder="Tafseel / Note" class="w-full text-xs p-2.5 pr-14 bg-white border border-gray-200 rounded-xl focus:ring-2 focus:ring-emerald-500 outline-none">
            
            <div class="absolute right-1.5 flex items-center gap-1">
              <!-- Mic Button (Speech-to-Text) -->
              <button id="mic-btn" onclick="startSpeechRecognition()" title="Bol kar likhein" class="p-1 rounded-lg text-gray-500 hover:text-emerald-700 hover:bg-gray-100 text-sm transition">
                🎙️
              </button>
              
              <!-- Camera / Photo Button -->
              <label for="receipt-camera-input" title="Bill ki picture lein" class="p-1 rounded-lg text-gray-500 hover:text-emerald-700 hover:bg-gray-100 text-sm cursor-pointer transition">
                📸
              </label>
              <input id="receipt-camera-input" type="file" accept="image/*" capture="environment" onchange="handleReceiptUpload(event)" class="hidden">
            </div>
          </div>
        </div>

        <div class="grid grid-cols-2 gap-2">
          <button onclick="addTransaction('diye')" class="py-2.5 bg-red-600 hover:bg-red-700 active:scale-95 text-white text-xs font-bold rounded-xl shadow transition">
            - Diye (Udhaar)
          </button>
          <button onclick="addTransaction('liye')" class="py-2.5 bg-emerald-600 hover:bg-emerald-700 active:scale-95 text-white text-xs font-bold rounded-xl shadow transition">
            + Liye (Wasooli)
          </button>
        </div>

        <!-- Quick Share / Actions -->
        <div class="grid grid-cols-2 gap-2 pt-1">
          <button onclick="sendWhatsApp()" class="py-2 bg-emerald-50 text-emerald-700 border border-emerald-300 font-bold rounded-xl flex items-center justify-center gap-1.5 text-xs hover:bg-emerald-100 transition">
            <span>💬</span> WhatsApp
          </button>
          <button onclick="downloadPDF()" class="py-2 bg-gray-100 text-gray-700 border border-gray-300 font-bold rounded-xl flex items-center justify-center gap-1.5 text-xs hover:bg-gray-200 transition">
            <span>📄</span> PDF Statement
          </button>
        </div>
      </div>

    </div>
  </div>

</body>
</html>
